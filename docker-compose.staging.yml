version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bhu_email_portal_uat_db
    environment:
      POSTGRES_USER: uat_user
      POSTGRES_PASSWORD: uat_password
      POSTGRES_DB: bhu_uat_db
    ports:
      - '5435:5432'
    volumes:
      - bhu_uat_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhu_email_portal_uat_backend
    environment:
      - NODE_ENV=staging
      - PORT=3001
      - DATABASE_URL=postgresql://uat_user:uat_password@postgres:5432/bhu_uat_db?schema=public
      - JWT_SECRET=uat_super_secret_key
      - MOCK_GOOGLE_WORKSPACE=true # Keep mocking ON during UAT to avoid spamming Google APIs
    ports:
      - '3001:3001'
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhu_email_portal_uat_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://staging-api.bhu.ac.in/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: bhu_uat_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  bhu_uat_pgdata:
