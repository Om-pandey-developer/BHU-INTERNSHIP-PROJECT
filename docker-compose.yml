version: '3.8'

services:
  db:
    image: postgres:16
    container_name: bhu_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhu_secure_password_2024}
      POSTGRES_DB: ${POSTGRES_DB:-bhu_email_portal}
    ports:
      - "5432:5432"
    volumes:
      - bhu_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: bhu_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@bhu.ac.in}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  bhu_postgres_data:
