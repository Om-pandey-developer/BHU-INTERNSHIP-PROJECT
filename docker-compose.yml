services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhu_backend
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    # The backend will now use the DATABASE_URL defined in ./backend/.env
    # which should point to your containerized db instance (postgresql://bhu_user:password@db:5432/bhu_db)
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bhu_network
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://10.32.25.137:4000/api/v1 # Change to your production API URL if needed
        # - NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAADwd2MRkwzf_c792
    container_name: bhu_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - bhu_network
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:15-alpine
    container_name: bhu_db
    environment:
      # Ensure you set these values in a .env file or hardcode for dev
      - POSTGRES_USER=bhu_user
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=bhu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/archive:/var/lib/postgresql/archive
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='cp %p /var/lib/postgresql/archive/%f'
      -c archive_timeout=60
    networks:
      - bhu_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bhu_user -d bhu_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bhu_network:
    driver: bridge

volumes:
  postgres_data:
