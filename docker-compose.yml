services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhu_backend
    restart: always
    ports:
      - "4050:4050"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bhu_network
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4050/api/v1
        - NEXT_PUBLIC_CAPTCHA_TYPE=svg
    container_name: bhu_frontend
    restart: always
    ports:
      - "3050:3050"
    environment:
      - PORT=3050
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - bhu_network
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:15-alpine
    container_name: bhu_db
    environment:
      - POSTGRES_USER=bhu_user
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=bhu_db
    ports:
      - "5450:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/archive:/var/lib/postgresql/archive
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='cp %p /var/lib/postgresql/archive/%f'
      -c archive_timeout=60
    networks:
      - bhu_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bhu_user -d bhu_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: bhu_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - bhu_network
    depends_on:
      - db

networks:
  bhu_network:
    driver: bridge

volumes:
  postgres_data:
